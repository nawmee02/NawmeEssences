name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'   # nightly — regenerate SEO pages from Supabase

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pinned: `ubuntu-latest` moves to Ubuntu 26.04 from 2026-10-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      # Majors that run on the Node 24 action runtime (Node 20 actions are deprecated on runners).
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Build site from Supabase (same path as local: build + schema check + recs test)
        run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Prune non-site files (node_modules symlinks break Pages processing)
        run: rm -rf node_modules scripts supabase assets .github .git package.json package-lock.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
        id: deployment
